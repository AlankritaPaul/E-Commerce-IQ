<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="130">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A">
        <animate attributeName="stop-color" values="#1E3A8A;#2563EB;#0284C7;#7C3AED;#1E3A8A" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#7C3AED;#2563EB;#06B6D4;#3B82F6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#3B82F6;#7C3AED;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 3px;
      fill: url(#brandGrad);
      filter: url(#neonGlow);
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #475569;
      letter-spacing: 5px;
    }
    .brand-dot {
      fill: #10B981;
    }
  </style>
  <g>
    <!-- Brand Icon Spark -->
    <text x="50%" y="65" text-anchor="middle" class="brand-title">E-COMMERCE IQ</text>
    <text x="50%" y="105" text-anchor="middle" class="brand-tagline">EXECUTIVE BUSINESS INTELLIGENCE &amp; AI COPILOT</text>
  </g>
</svg>
